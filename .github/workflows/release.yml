name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      publish-npm: ${{ steps.npm-check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test ./...
      - name: Check whether npm publishing is configured
        id: npm-check
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "$NPM_TOKEN" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Publish GitHub release assets
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    needs: [verify, goreleaser]
    if: ${{ needs.verify.outputs.publish-npm == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Sync npm package version to tag
        working-directory: packages/npm-shim
        run: npm version ${GITHUB_REF_NAME#v} --no-git-tag-version
      - name: Install npm dependencies
        working-directory: packages/npm-shim
        run: npm install
      - name: Smoke pack npm shim
        working-directory: packages/npm-shim
        run: npm pack --dry-run
      - name: Publish npm package
        working-directory: packages/npm-shim
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
