schema = "https://codexthemes.dev/schemas/theme.schema.json"
id = "gruvbox-dark"
name = "Gruvbox Dark"
family = "retro"
version = "1.0.0"
appearance = "dark"
description = "Warm retro earth tones with strong terminal heritage."
author = "Codex Themes"
license = "MIT"
homepage = "https://github.com/ychampion/codex-themes"
tags = ["gruvbox", "retro", "dark"]
codex_min_version = "0.1.0"

[accessibility]
min_contrast_body = 4.5
min_contrast_ui = 3
color_blind_safe = true

[tokens]
bg_primary = "#282828"
bg_secondary = "#32302F"
bg_tertiary = "#3C3836"
bg_overlay = "#282828CC"
fg_primary = "#EBDBB2"
fg_secondary = "#D5C4A1"
fg_muted = "#A89984"
fg_inverse = "#0F1115"
border = "#3C3836"
border_subtle = "#32302F"
border_focus = "#FABD2F"
accent_primary = "#FABD2F"
accent_secondary = "#D79921"
accent_soft = "#4E4329"
assistant_msg = "#83A598"
user_msg = "#D3869B"
tool_output = "#B8BB26"
shell_stdout = "#D5C4A1"
shell_stderr = "#FB4934"
status_bg = "#32302F"
status_fg = "#EBDBB2"
status_accent = "#FABD2F"
input_bg = "#2F2D2D"
input_fg = "#EBDBB2"
input_placeholder = "#A89984"
selection_bg = "#665534"
selection_fg = "#EBDBB2"
cursor = "#FABD2F"
link = "#83A598"
info = "#8EC07C"
success = "#B8BB26"
warning = "#FABD2F"
error = "#FB4934"
diff_add = "#B8BB26"
diff_remove = "#FB4934"
diff_change = "#FABD2F"
code_inline = "#83A598"
syntax_plain = "#EBDBB2"
syntax_comment = "#A89984"
syntax_keyword = "#D3869B"
syntax_string = "#B8BB26"
syntax_number = "#FABD2F"
syntax_function = "#83A598"
syntax_type = "#8EC07C"
syntax_variable = "#EBDBB2"
syntax_operator = "#D79921"

[ansi]
black = "#282828"
red = "#FB4934"
green = "#B8BB26"
yellow = "#FABD2F"
blue = "#83A598"
magenta = "#D3869B"
cyan = "#8EC07C"
white = "#EBDBB2"
bright_black = "#575757"
bright_red = "#FB5F4C"
bright_green = "#C1C340"
bright_yellow = "#FBC548"
bright_blue = "#92B0A4"
bright_magenta = "#D895A7"
bright_cyan = "#9CC88C"
bright_white = "#EDDEB8"

[targets.codex]
config_patch = { mode = "merge", path = "config/codex.toml" }

[targets.windows_terminal]
scheme_name = "Gruvbox Dark"

[targets.iterm2]
profile_name = "Gruvbox Dark"

[targets.ghostty]
theme_name = "Gruvbox Dark"

[targets.alacritty]
theme_name = "Gruvbox Dark"

